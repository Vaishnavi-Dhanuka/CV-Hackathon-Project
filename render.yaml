services:
  - type: web
    name: lumina-retinex-api
    runtime: python
    plan: free
    buildCommand: git submodule update --init --recursive && python -m pip install -r requirements-render.txt
    startCommand: python scripts/fetch_render_checkpoint.py && uvicorn deep_learning.api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: RETINEXFORMER_MAX_UPLOAD_BYTES
        value: "10485760"
      - key: RETINEXFORMER_MAX_IMAGE_PIXELS
        value: "4194304"
      - key: GITHUB_TOKEN
        sync: false

  - type: web
    name: lumina-streamlit
    runtime: python
    plan: free
    buildCommand: python -m pip install -r requirements-render-frontend.txt
    startCommand: python -m streamlit run app/main.py --server.address 0.0.0.0 --server.port $PORT --server.headless true --server.maxUploadSize 10
    healthCheckPath: /
    envVars:
      - key: LUMINA_DL_API_URL
        fromService:
          name: lumina-retinex-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
